[project]
name = "linear-regression-model"
version = "0.1.0"
description = "iTalkSign hearing-loss-risk regression model, API, and Flutter app (ALU regression summative)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.0",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
]
